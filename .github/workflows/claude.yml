name: Claude Code

on:
  issue_comment:
    types: [created]

jobs:
  claude:
    if: github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc
        with:
          # the repo secret named ANTHROPIC_API_KEY holds the OAuth token
          claude_code_oauth_token: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Check restore-symlink marker
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/rs-live-marker" ]; then
            echo "MARKER_FOUND:"
            cat "$RUNNER_TEMP/rs-live-marker"
          else
            echo "NO_MARKER"
          fi
