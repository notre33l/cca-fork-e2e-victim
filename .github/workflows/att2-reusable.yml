name: att2-reusable-callee
on:
  workflow_call:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: exchange probe (callee)
        env:
          PROBE_TAG: att2-fork-callee-modified
        run: |
          echo 'ATT2-MARKER: FORK-PR-MODIFIED-CALLEE-EXECUTING'
          python3 scripts/att2-probe.py
